<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add New Stock</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='AddStock.css') }}">
    </head>
    <body>
        <div id="Main_Box">
            <h1 id="Main_Title">Add New Stock</h1>

            <form id="add-stock-form" method="POST" action="{{ url_for('stock_api.add_stock') }}">
                <label for="ticker">Stock Ticker (e.g. AAPL_US_EQ)</label>
                <input id="ticker" name="ticker" required />

                <button type="submit">Create Stock</button>
                <a class="btn-cancel" href="{{ url_for('dashboard') }}">Cancel</a>
            </form>
        </div>

        <script src="{{ url_for('static', filename='AddStock.js') }}"></script>
    </body>
</html>
