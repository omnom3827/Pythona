<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pythona Setup</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='AddUser.css') }}">
    </head>
    <body>
        <div id="Add_User_Box">
            <h1 id="Add_User_Title">Pythona Setup</h1>
            <form method="POST" action="{{ url_for('auth.addUser') }}">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Set Root Login</button>
            </form>
        </div>
    </body>
</html>
